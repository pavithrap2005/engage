<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indiquer Widget Test Page</title>
  <!-- Google Outfit Font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0b0f19 0%, #151b2c 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-top: 0;
      background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 999px;
      font-size: 12px;
      color: #a5b4fc;
      margin-bottom: 12px;
    }
    .status {
      margin-top: 15px;
      font-size: 13px;
      color: #34d399;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Local Environment Test</div>
    <h1>Indiquer Chat Widget Test</h1>
    <p>
      The chat bubble should appear in the bottom-right corner. Click it to begin chatting with the Indiquer AI bot.
    </p>
    <div class="status" id="status-msg">✓ Widget script connected to local backend (http://localhost:3001)</div>
  </div>

  <!-- Load Compiled Widget from Local Backend -->
  <script src="/widget.js"></script>
  
  <script>
    (function() {
      function initIndiquer() {
        if (window.Indiquer) {
          window.Indiquer.init({
            appId: '3b590690-986b-41b3-9cdc-75669a89a552',
            apiHost: 'http://localhost:3001'
          });
        }
      }
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        initIndiquer();
      } else {
        document.addEventListener('DOMContentLoaded', initIndiquer);
      }
    })();
  </script>
</body>
</html>
