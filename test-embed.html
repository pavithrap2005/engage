<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indiquer Chat Widget Live Test</title>

  <!-- Prevent Live Server from forcing continuous page reloads on database changes -->
  <script>
    (function() {
      const OriginalWebSocket = window.WebSocket;
      window.WebSocket = function(url, protocols) {
        const ws = new OriginalWebSocket(url, protocols);
        if (typeof url === 'string' && (url.includes(':5500') || url.includes('/ws') || url.includes('127.0.0.1:5500'))) {
          const origAddEventListener = ws.addEventListener.bind(ws);
          ws.addEventListener = function(type, listener, options) {
            if (type === 'message') {
              const safeListener = function(event) {
                if (event.data === 'reload') {
                  console.log('[Live Server] Ignored reload event from database write.');
                  return;
                }
                listener(event);
              };
              return origAddEventListener(type, safeListener, options);
            }
            return origAddEventListener(type, listener, options);
          };
          // Also intercept onmessage property
          let customOnMessage = null;
          Object.defineProperty(ws, 'onmessage', {
            get: () => customOnMessage,
            set: (fn) => {
              customOnMessage = function(event) {
                if (event.data === 'reload') {
                  console.log('[Live Server] Ignored reload event from database write.');
                  return;
                }
                if (typeof fn === 'function') fn(event);
              };
            }
          });
        }
        return ws;
      };
      window.WebSocket.prototype = OriginalWebSocket.prototype;
    })();
  </script>
  <!-- Google Outfit Font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0b0f19 0%, #151b2c 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(52, 211, 153, 0.12);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
      }

      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(52, 211, 153, 0);
      }

      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
      }
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    button.action-btn {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, opacity 0.15s;
    }

    button.action-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button.action-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    button.action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .log-box {
      margin-top: 22px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
      color: #cbd5e1;
      max-height: 120px;
      overflow-y: auto;
    }

    .log-entry {
      margin-bottom: 4px;
    }

    .log-entry.success {
      color: #34d399;
    }

    .log-entry.info {
      color: #60a5fa;
    }

    .log-entry.warn {
      color: #f87171;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="badge">
      <span class="pulse-dot"></span>
      <span>Live Chat Widget Connected</span>
    </div>

    <h1>Indiquer Chat Widget Test</h1>
    <p>
      The widget is running live. The chat window is open in the bottom-right corner. You can type and send test
      messages directly, or use the controls below:
    </p>

    <div class="btn-grid">
      <button class="action-btn" id="open-btn">💬 Open Widget</button>
      <button class="action-btn secondary" id="close-btn">✕ Close Widget</button>
      <button class="action-btn secondary" id="toggle-btn">🔄 Toggle Widget</button>
      <button class="action-btn secondary" id="test-msg-btn">🚀 Send Test Message</button>
    </div>

    <div class="log-box" id="log-box">
      <div class="log-entry info">[System] Initializing test harness...</div>
    </div>
  </div>

  <!-- Socket.IO client from backend -->
  <script src="http://localhost:3001/socket.io/socket.io.js"></script>

  <!-- Complete Standalone & Live Indiquer Widget Logic -->
  <script>
    function addLog(text, type = 'info') {
      const box = document.getElementById('log-box');
      if (!box) return;
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      box.appendChild(entry);
      box.scrollTop = box.scrollHeight;
    }

    class IndiquerWidgetEngine {
      constructor() {
        this.config = {
          appId: 'default-app-id',
          apiHost: 'http://localhost:3001'
        };
        this.isOpen = false;
        this.socket = null;
        this.visitorId = 'tester-' + Math.random().toString(36).substring(2, 9);
        this.sessionId = 'sess-' + Math.random().toString(36).substring(2, 9);
        this.workspaceId = '';
        this.roomId = '';
        this.preChatSubmitted = true;
        this.visitorName = 'Test User';
        this.visitorEmail = 'tester@indiquer.ai';
        this.customization = {
          color: '#4F46E5',
          shape: 'ROUND',
          position: 'BOTTOM_RIGHT',
          welcomeMessage: 'Hello! Welcome to Indiquer Engage. How can we help you today?',
          offlineMessage: 'We are currently offline.',
          autoOpen: true,
          delayTimer: 1,
          isDarkMode: false
        };
      }

      async init(config = {}) {
        Object.assign(this.config, config);
        addLog(`Connecting to backend at ${this.config.apiHost}...`, 'info');

        try {
          const res = await fetch(`${this.config.apiHost}/api/widget-delivery/init`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ appId: this.config.appId, visitorId: this.visitorId })
          });
          if (res.ok) {
            const data = await res.json();
            if (data.customization) this.customization = Object.assign(this.customization, data.customization);
            if (data.visitorId) this.visitorId = data.visitorId;
            if (data.workspaceId) this.workspaceId = data.workspaceId;
            addLog(`✓ Backend initialized (Workspace: ${this.workspaceId || 'Default'})`, 'success');
          } else {
            addLog(`Backend responded HTTP ${res.status}, using standard demo profile.`, 'info');
          }
        } catch (e) {
          addLog(`Could not reach backend API, running with local simulation mode: ${e.message}`, 'info');
        }

        this.createDom();
        this.setupSocket();

        // Auto open immediately for testing
        setTimeout(() => {
          this.open();
          addLog('✓ Chat widget opened at bottom-right.', 'success');
        }, 300);
      }

      createDom() {
        if (document.getElementById('indiquer-widget-root')) return;

        this.container = document.createElement('div');
        this.container.id = 'indiquer-widget-root';
        this.container.style.position = 'fixed';
        this.container.style.bottom = '20px';
        this.container.style.right = '20px';
        this.container.style.zIndex = '999999';
        this.container.style.fontFamily = 'Outfit, system-ui, sans-serif';

        this.shadow = this.container.attachShadow({ mode: 'open' });
        document.body.appendChild(this.container);

        this.injectStyles();
        this.render();
      }

      injectStyles() {
        const primaryColor = this.customization.color || '#4f46e5';
        const style = document.createElement('style');
        style.textContent = `
          @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
          
          .launcher {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: linear-gradient(135deg, ${primaryColor} 0%, #6366f1 100%);
            box-shadow: 0 6px 24px rgba(79, 70, 229, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
            border: none;
            outline: none;
            position: relative;
            z-index: 10;
          }
          .launcher:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(79, 70, 229, 0.55);
          }
          .launcher svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s;
          }
          .launcher.open svg {
            transform: rotate(90deg);
          }

          .chat-window {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 380px;
            height: 530px;
            border-radius: 20px;
            background: ${this.customization.isDarkMode ? '#0b0f19' : '#ffffff'};
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9;
          }
          .chat-window.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
          }

          .header {
            background: linear-gradient(135deg, ${primaryColor} 0%, #6366f1 100%);
            padding: 18px 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
          }
          .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
          }
          .header-info h4 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
          }
          .header-info p {
            margin: 2px 0 0 0;
            font-size: 11px;
            opacity: 0.85;
          }

          .message-list {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
          }
          .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.4;
            word-wrap: break-word;
          }
          .message.bot {
            background: white;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
          }
          .message.user {
            background: ${primaryColor};
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
          }

          .typing-indicator {
            font-size: 11px;
            color: #94a3b8;
            padding: 4px 16px;
            background: white;
            display: none;
          }

          .input-area {
            padding: 12px 14px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
            background: white;
          }
          .input-area input {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
          }
          .input-area input:focus {
            border-color: ${primaryColor};
          }
          .input-area button {
            background: ${primaryColor};
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
          }
        `;
        this.shadow.appendChild(style);
      }

      render() {
        const launcher = document.createElement('button');
        launcher.className = 'launcher';
        launcher.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        `;

        const chatWindow = document.createElement('div');
        chatWindow.className = 'chat-window';
        chatWindow.innerHTML = `
          <div class="header">
            <div class="header-logo">I</div>
            <div class="header-info">
              <h4>${this.customization.name || 'Indiquer Assistant'}</h4>
              <p>AI Customer Assistant (Online)</p>
            </div>
          </div>
          <div class="message-list" id="msg-list">
            <div class="message bot">${this.customization.welcomeMessage || 'Hello! Welcome to Indiquer Engage. How can we help you today?'}</div>
          </div>
          <div class="typing-indicator" id="typing-indicator">Agent is typing...</div>
          <form class="input-area" id="chat-form">
            <input type="text" placeholder="Type your message..." required id="chat-input" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        `;

        launcher.addEventListener('click', () => this.toggle());

        this.shadow.appendChild(chatWindow);
        this.shadow.appendChild(launcher);

        const form = this.shadow.querySelector('#chat-form');
        const input = this.shadow.querySelector('#chat-input');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const text = input.value.trim();
          if (!text) return;
          this.sendMessage(text);
          input.value = '';
        });
      }

      setupSocket() {
        if (typeof io !== 'undefined') {
          try {
            this.socket = io(this.config.apiHost);
            this.socket.on('connect', () => {
              addLog('✓ Real-time Socket.IO connected to backend!', 'success');
              this.socket.emit('visitorInit', {
                workspaceId: this.workspaceId || this.visitorId,
                visitorId: this.visitorId
              });
            });

            this.socket.on('visitorInitSuccess', (data) => {
              this.roomId = data?.room?.id;
              addLog(`Chat room established: ${this.roomId}`, 'info');
            });

            this.socket.on('typing', (data) => {
              const typingEl = this.shadow.querySelector('#typing-indicator');
              if (typingEl) {
                if (data.isTyping) {
                  typingEl.textContent = `${data.senderName || 'Indiquer AI Bot'} is typing...`;
                  typingEl.style.display = 'block';
                } else {
                  typingEl.style.display = 'none';
                }
              }
            });

            this.socket.on('message', (msg) => {
              if (msg.senderType !== 'VISITOR') {
                const typingEl = this.shadow.querySelector('#typing-indicator');
                if (typingEl) typingEl.style.display = 'none';
                this.appendBubble(msg.content, 'bot');
                addLog(`AI Response: "${msg.content.substring(0, 60)}..."`, 'success');
              }
            });
          } catch (e) {
            addLog(`Socket.IO setup notice: ${e.message}`, 'info');
          }
        }
      }

      async sendMessage(text) {
        this.appendBubble(text, 'user');
        addLog(`Sent: "${text}"`, 'info');

        const typingEl = this.shadow.querySelector('#typing-indicator');
        if (typingEl) {
          typingEl.textContent = 'Indiquer AI Bot is typing...';
          typingEl.style.display = 'block';
        }

        if (this.socket && this.roomId) {
          this.socket.emit('sendMessage', {
            roomId: this.roomId,
            senderType: 'VISITOR',
            senderId: this.visitorId,
            content: text
          });
        } else {
          // Direct real-time Groq API generation
          try {
            const systemPrompt = `You are a helpful customer support bot for Indiquer Engage.
You answer support questions professionally, concisely, and helpfully.
Our pricing tiers: Starter ($19/mo), Professional ($49/mo), Enterprise (Custom).
Our features: Float chat widgets, active visitor tracking dashboards, automation rules.
Refund policy: 14 days full refund.
Keep answers under 3 sentences.`;

            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + (window.GROQ_API_KEY || ''),
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'openai/gpt-oss-120b',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: text }
                ],
                temperature: 0.6,
                max_tokens: 250
              })
            });

            if (typingEl) typingEl.style.display = 'none';

            if (res.ok) {
              const data = await res.json();
              const aiReply = data.choices?.[0]?.message?.content?.trim() || "I'm here to help with any questions about Indiquer Engage!";
              this.appendBubble(aiReply, 'bot');
              addLog(`AI Response (Groq): "${aiReply.substring(0, 60)}..."`, 'success');
            } else {
              throw new Error(`Groq status ${res.status}`);
            }
          } catch (err) {
            if (typingEl) typingEl.style.display = 'none';
            const fallback = "Thank you for reaching out! We received your message and will assist you right away.";
            this.appendBubble(fallback, 'bot');
            addLog(`Notice: ${err.message}`, 'info');
          }
        }
      }

      appendBubble(text, type) {
        const msgList = this.shadow.querySelector('#msg-list');
        if (!msgList) return;
        const bubble = document.createElement('div');
        bubble.className = `message ${type}`;
        bubble.textContent = text;
        msgList.appendChild(bubble);
        msgList.scrollTop = msgList.scrollHeight;
      }

      open() {
        this.isOpen = true;
        const launcher = this.shadow.querySelector('.launcher');
        const chatWindow = this.shadow.querySelector('.chat-window');
        if (launcher && chatWindow) {
          launcher.classList.add('open');
          chatWindow.classList.add('open');
          launcher.innerHTML = `
            <svg viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          `;
        }
      }

      close() {
        this.isOpen = false;
        const launcher = this.shadow.querySelector('.launcher');
        const chatWindow = this.shadow.querySelector('.chat-window');
        if (launcher && chatWindow) {
          launcher.classList.remove('open');
          chatWindow.classList.remove('open');
          launcher.innerHTML = `
            <svg viewBox="0 0 24 24">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          `;
        }
      }

      toggle() {
        if (this.isOpen) {
          this.close();
        } else {
          this.open();
        }
      }
    }

    // Initialize Widget on load
    const widget = new IndiquerWidgetEngine();
    window.Indiquer = widget;

    document.addEventListener('DOMContentLoaded', () => {
      widget.init({
        appId: 'default-app-id',
        apiHost: 'http://localhost:3001'
      });

      // Hook up UI buttons
      document.getElementById('open-btn').addEventListener('click', () => widget.open());
      document.getElementById('close-btn').addEventListener('click', () => widget.close());
      document.getElementById('toggle-btn').addEventListener('click', () => widget.toggle());
      document.getElementById('test-msg-btn').addEventListener('click', () => {
        widget.open();
        widget.sendMessage('Hello from the interactive test panel! 👋');
      });
    });
  </script>
</body>

</html>
