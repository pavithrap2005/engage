<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Temp Widget Test Page</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
      background: #f1f5f9;
      color: #1e293b;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      max-width: 600px;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Indiquer Chat Widget Local Test</h1>
    <p>This is a temporary page to test the widget and visual bot builder flow.</p>
  </div>

  <!-- Indiquer Chat Widget -->
  <script src="https://api-engage.indiquer.in/widget.js"></script>
  <script>
    (function () {
      function initIndiquer() {
        if (window.Indiquer) {
          window.Indiquer.init({
            appId: "41de94a0-65e6-430f-9f46-cc8615a94623",
            apiHost: "https://api-engage.indiquer.in"
          });
        }
      }
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        initIndiquer();
      } else {
        document.addEventListener('DOMContentLoaded', initIndiquer);
      }
    })();
  </script>
</body>

</html>
